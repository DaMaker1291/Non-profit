# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION DEPLOYMENT — a TEMPLATE with a manual approval gate.
#
# Like deploy-staging.yml, this is a shape, not a live pipeline: no production
# host is assumed. It will not deploy anything until the `production` environment
# is configured in the repository settings.
#
# The `production` environment MUST require reviewers: the whole point of this
# file is that production is reached by an explicit human approval, after staging
# has been smoked, never by a merge alone. Configure that in
# Settings → Environments → production → Required reviewers.
#
# Prerequisites (environment secrets/variables):
#   PRODUCTION_DEPLOY_HOOK   a URL that triggers the production deploy
#   PRODUCTION_URL           the public base URL, e.g. https://openmind.example.org
#   PRODUCTION_ROLLBACK_HOOK (optional) a URL that redeploys the previous artefact
#
# Rules this workflow assumes and must never break:
#   · production is IMMUTABLE — deploy an artefact, never edit the host;
#   · a bad deploy is fixed by deploying the PREVIOUS artefact (rollback), not by
#     patching in place;
#   · /api/ready is the load balancer's readiness probe, so an instance that is
#     not ready is never sent traffic;
#   · a content change is a published version (audit/content-release.json); an
#     evidence-schema change is a migration (docs/DATA_GOVERNANCE.md).
# ─────────────────────────────────────────────────────────────────────────────
name: deploy-production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm a production release"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # The environment's required reviewers are the approval gate.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Confirm intention
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::input 'confirm' must be exactly DEPLOY"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # The same checklist staging passed. Production is not the place to find
      # out whether the build is shippable. It runs WITHOUT the production
      # DATABASE_URL on purpose: the checklist is read-only, but pointing it at
      # the live database would run `db:verify`'s probes there, and the deploy
      # job does its own explicit pre-flight below instead.
      - name: Production check
        run: npm run production-check

      # ── BACKUP → MIGRATION → ROLLOUT → HEALTH CHECK (docs/DEPLOYMENT.md §4) ──
      #
      # The migration runs BEFORE the new code is rolled out, and the order is
      # the point: a schema behind the code fails at the first request that
      # touches a new column, and a schema AHEAD of the code is what makes a
      # rollback unsafe. `db:status` first, so a drifted history stops the deploy
      # before anything is applied to it.
      #
      # THE BACKUP IS NOT TAKEN HERE, and that is deliberate rather than an
      # omission: a production backup belongs to the database host, not to this
      # repository, and `OPERATIONS.md` §4 says which one and how it is rehearsed.
      # What this workflow enforces is the part it CAN enforce — that the
      # migration is a separate, reviewable, reversible step that happens before
      # the rollout, and that nothing reverts the schema automatically.
      - name: Is a production database configured?
        id: db
        run: |
          if [ -n "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no PRODUCTION_DATABASE_URL secret — this deployment's store is the file-backed one, so there is nothing to migrate."
          fi

      - name: Database pre-flight (drift, pending)
        if: steps.db.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          OPENMIND_ENV: production
        run: npm run db:status

      - name: Confirm a backup exists, then migrate
        if: steps.db.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          OPENMIND_ENV: production
          # Recorded in schema_migrations, so "which build changed this schema"
          # is answerable from the database itself during an incident.
          OPENMIND_RELEASE: ${{ github.sha }}
        run: |
          echo "::notice::MIGRATING ${GITHUB_SHA} after a backup of the production database taken per OPERATIONS.md §4."
          npm run db:migrate

      - name: Is a production target configured?
        id: gate
        run: |
          if [ -n "${{ secrets.PRODUCTION_DEPLOY_HOOK }}" ] && [ -n "${{ vars.PRODUCTION_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::production is not configured (PRODUCTION_DEPLOY_HOOK secret and PRODUCTION_URL variable). Skipping the deploy step — this is a template, not a live environment."
          fi

      - name: Deploy the built artefact
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          # The release identity /api/health reports, so a learner's session can
          # be traced to one artefact (docs/DEPLOYMENT.md §11).
          DEPLOYMENT_ID: ${{ github.sha }}
        run: |
          curl -fsS -X POST "$DEPLOY_HOOK" \
            -H "content-type: application/json" \
            -d "{\"deploymentId\": \"${DEPLOYMENT_ID}\"}"
          echo "deploy triggered for ${DEPLOYMENT_ID}"

      - name: Verify the deployed production URL
        if: steps.gate.outputs.configured == 'true'
        env:
          OPENMIND_BASE: ${{ vars.PRODUCTION_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$OPENMIND_BASE/api/health"; then break; fi
            sleep 5
          done
          # Readiness must be 200 before this job is allowed to pass.
          if ! curl -sf -o /dev/null "$OPENMIND_BASE/api/ready"; then
            echo "::error::/api/ready did not return 200 — take this instance out of rotation and roll back."
            exit 1
          fi
          npm run smoke

      - name: Rollback instructions
        if: failure() && steps.gate.outputs.configured == 'true'
        run: |
          echo "::warning::A post-deploy check failed. Roll back by redeploying the previous artefact (PRODUCTION_ROLLBACK_HOOK) or the previous image tag."
          echo "See docs/OPERATIONS.md §5.1 and docs/DEPLOYMENT.md §11."
