# Publish the project page to GitHub Pages.
#
# What this deploys, and what it deliberately does not: OpenMind is a stateful
# server application (API routes that grade answers, session cookies, a store of
# JSON files on a real disk). GitHub Pages serves static files, so it can host
# the PROJECT PAGE and cannot host the app. Rather than publish a static export
# whose pages would load empty, this workflow publishes the page that explains
# what the app is and how to run it — one container, one persistent disk.
name: pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
