# The five gates, on every push. This is the same set the repository documents
# and the same set that must be green before a change lands — run here so a
# claim of "all gates pass" is checkable by anyone, not just by the person who
# typed it.
#
# The e2e suite drives HTTP against a running server, so the workflow starts the
# production server on the port the suite expects (4173) and waits for it to
# answer before running. The suite creates its own profiles in an ephemeral
# workspace store, so nothing here touches a real deployment's data.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Compiler
        run: npm run typecheck

      - name: Engine suite
        run: npm run verify

      - name: Content graph
        run: npm run content-check

      - name: Question audit
        run: npm run verify:q

      # The content ceiling: the level each advanced tier PROMISES versus the
      # level its practice can actually serve (measured through the production
      # serve path, reported as a distribution). This is the gate for the fault
      # the audit found — A2 declared 0.90 and served a median of 0.65 — and it
      # fails if a concept's ceiling, a tier's median, or the share of concepts
      # below target regresses. audit/ceiling-baseline.json is its floor.
      - name: Content ceiling
        run: npm run gate:ceiling

      # ── CAN THIS COURSE'S DECLARED LEVEL ACTUALLY BE TAUGHT? ────────────────
      # The ceiling gate measures the level a tier's practice lands at; this one
      # measures whether the CONTENT EXISTS to land there at all. It fails if a
      # concept a course serves cannot produce an item in the demand band that
      # course asks for, if the small exemption set among the primary-arithmetic
      # concepts stops matching the engine's, if an exemption goes stale, if an
      # advertised course covers a concept with no generator, or if the declared
      # demand ladder stops being producible by the bank. Together with
      # `content-check` (the graph) and `verify:q` (every generated item) it is
      # the half of the pipeline that protects the learner from being served
      # work beneath their course.
      - name: Content gate
        run: npm run content-gate

      # Printed, not asserted: the per-course table the gate above acts on, so a
      # failure in CI arrives with the numbers that explain it. docs/
      # CONTENT_COVERAGE_REPORT.md is the same data, regenerated by
      # `npm run content-audit -- --report` rather than written by hand.
      - name: Content coverage (report)
        run: npm run content-audit

      - name: Production build
        run: npm run build
      # ── Serve the artefact we just built, and check it is SERVED styled ──────
      # Building is not shipping. A Next standalone server returns HTML that
      # points at a separate, content-hashed static tree, so a build can compile
      # perfectly and still render as bare HTML if the two halves disagree — the
      # document answers 200 and only the stylesheet 404 says otherwise. That is
      # not hypothetical: it is how this product once shipped a completely
      # unstyled page (Times New Roman, default links, two navs, footer jammed
      # under the content). These two gates boot the real production artefact and
      # assert the document's own assets resolve, that typography comes from the
      # stylesheet, that exactly one nav is visible per breakpoint, that the
      # footer is pushed to the bottom, and that /curriculum shows content or a
      # real empty state.
      - name: Assemble the standalone server
        run: |
          rm -rf .next/standalone/public .next/standalone/.next/static
          cp -r public .next/standalone/ 2>/dev/null || true
          cp -r .next/static .next/standalone/.next/static

      - name: Start the production build
        run: |
          export OPENMIND_DATA_DIR="$PWD/.ci-data"
          (cd .next/standalone && PORT=3000 nohup node server.js > /tmp/om-prod.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/

      - name: Build asset integrity (the unstyled-page gate)
        run: npm run verify:build -- --dist .next --port 3000

      - name: Production render gate
        run: npm run verify:render -- --port 3000

      # ── THE ONE MANDATORY JOURNEY, AGAINST THE ARTEFACT WE SHIP ────────────
      # A learner who has never been here, from the front door to their next
      # recommendation: sign up → onboard → select course → diagnostic → first
      # task → answer → feedback → evidence → next recommendation.
      #
      # It runs against the PRODUCTION server started above (port 3000), not the
      # dev server below, and that is the whole point of it: the deep suite
      # (npm run e2e) needs the `reveal` test hook, which a production build
      # strips on purpose, so until this step existed no test could run against
      # the build we actually serve. This one asks only for what a learner could
      # ask for — the product tells the learner the answer AFTER they answer, so
      # the journey never needs to know it in advance.
      - name: Fresh-learner journey (production build)
        run: npm run e2e:fresh:only
        env:
          OPENMIND_BASE: http://localhost:3000


      # ── AND THE SITE LEARNERS ACTUALLY USE ────────────────────────────────
      # Everything above drives the Next application, which needs a server.
      # The pages GitHub Pages serves are the static build in `docs/`, and until
      # this step existed nothing loaded them in a browser: `verify:static`
      # checks the artefact as FILES, and says so in its own header. So the one
      # product with real users was the one outside behavioural coverage, and a
      # renamed asset (the engine then never loads) or a raw dictionary key
      # could ship unnoticed.
      #
      # `verify:ui` walks the Next application; this walks the published page.
      # Both need Chrome, which the runner has.
      - name: The published page, walked in a real browser
        run: |
          npm run build:static
          npm run verify:live

      # The suite drives the `reveal` test hook, which a production build strips
      # on purpose — a hook that works in production is a production hole. So it
      # runs against the DEVELOPMENT server, which is also how it is run locally;
      # the build above is what proves the release artefact compiles. Starting
      # the wrong server here does not weaken the gate, it reports the product
      # broken when the harness is at fault. (scripts/e2e-api.mjs says the same
      # thing itself, with a preflight, if anyone mixes the two up.)
      - name: HTTP end-to-end suite
        run: |
          npm run dev > /tmp/openmind-ci.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:4173/; then break; fi
            sleep 2
          done
          npm run e2e
          npm run verify:ui
          if [ -f /tmp/openmind-ci.log ]; then tail -20 /tmp/openmind-ci.log; fi
